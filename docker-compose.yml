version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: classroom-scheduler-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/classroom_scheduler
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      NODE_ENV: development
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: noreply@classroomscheduler.com
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - classroom-scheduler-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: classroom-scheduler-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - classroom-scheduler-network

  mongodb:
    image: mongo:7.0
    container_name: classroom-scheduler-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: classroom_scheduler
    volumes:
      - mongodb_data:/data/db
    networks:
      - classroom-scheduler-network

  redis:
    image: redis:7.0-alpine
    container_name: classroom-scheduler-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - classroom-scheduler-network

volumes:
  mongodb_data:
  redis_data:

networks:
  classroom-scheduler-network:
    driver: bridge
